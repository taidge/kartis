<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f5ef">
  <meta name="description" content="Explore 35 interactive Rust chart types with SVG, Canvas, live data and spring animation.">
  <title>Kartis — Chart explorer</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="boot" role="status" aria-live="polite" aria-busy="true">
    <img src="/favicon.svg" width="44" height="44" alt="">
    <strong id="boot-title">Loading Kartis charts…</strong>
    <span id="boot-message">Preparing the interactive chart explorer.</span>
    <progress aria-label="Loading chart explorer"></progress>
    <button id="boot-retry" type="button" hidden>Try again</button>
  </div>
  <div id="showcase"></div>
  <noscript><style>#boot { display: none; }</style><p class="error">Enable JavaScript and WebAssembly to use the chart explorer.</p></noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
