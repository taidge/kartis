[package]
name = "kartis-site"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]
resolver = "3"

[dependencies]
kartis = { path = "../..", features = ["web", "geojson"] }
glory = { version = "0.8.0", default-features = false, features = ["web"] }
serde_json = "1"
js-sys = "=0.3.107"
wasm-bindgen-futures = "=0.4.80"
wasm-bindgen = "=0.2.130"
web-sys = { version = "=0.3.107", features = [
    "Blob", "BlobPropertyBag", "Clipboard", "CssStyleDeclaration", "Document", "DomRect",
    "DomTokenList", "Element", "Event", "EventTarget", "FocusOptions", "History",
    "HtmlCollection", "HtmlAnchorElement", "HtmlButtonElement", "HtmlElement", "HtmlInputElement", "HtmlSelectElement",
    "KeyboardEvent", "Location", "MediaQueryList", "Navigator", "Node", "NodeList",
    "PageTransitionEvent", "ResizeObserver", "Url", "Window", "console",
] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
