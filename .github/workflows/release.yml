name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  publish:
    name: Publish and create GitHub release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95.0'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require a release tag on main
        shell: bash
        run: |
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
      - name: Package the tested source for checksum verification
        run: cargo package --locked --all-features --no-verify
      - name: Check version and published package identity
        id: package
        run: python scripts/release.py verify --tag "$RELEASE_TAG"
      # Configure taidge/kartis and release.yml as a trusted publisher on crates.io
      # after the first local release. No long-lived crates.io secret is needed.
      - name: Authenticate with crates.io
        if: steps.package.outputs.exists != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
      - name: Publish missing version
        if: steps.package.outputs.exists != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --all-features --no-verify
      - name: Verify crates.io checksum
        id: published
        run: python scripts/release.py verify --tag "$RELEASE_TAG" --require-published
      - name: Create or resume GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MANIFEST_PATH: ${{ steps.published.outputs.manifest_path }}
          CHECKSUM_PATH: ${{ steps.published.outputs.checksum_path }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Kartis $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "$MANIFEST_PATH" "$CHECKSUM_PATH" --clobber
