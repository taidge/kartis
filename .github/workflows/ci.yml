name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit or tag to check
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Spelling, formatting and workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0
        with:
          config: typos.toml
          files: .
      - name: Check spelling including workflow files
        shell: bash
        run: '"$RUNNER_TEMP/typos" --hidden --config typos.toml'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-11-04
          components: rustfmt
      - run: cargo +nightly-2026-11-04 fmt --package kartis -- --check
      - run: cargo +nightly-2026-11-04 fmt --manifest-path site/wasm/Cargo.toml -- --check
      - name: Format independent example packages
        shell: bash
        run: |
          for pair in browser-canvas:kartis-canvas-demo browser-widget:kartis-widget-fixture browser-host:kartis-host-fixture browser-raster:kartis-raster-fixture native-raster:kartis-native-raster; do
            example="${pair%%:*}"
            package="${pair#*:}"
            cargo +nightly-2026-11-04 fmt --manifest-path "examples/$example/Cargo.toml" --package "$package" -- --check
          done
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check workflow syntax
        shell: bash
        run: |
          tool_dir="$RUNNER_TEMP/kartis-actionlint"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$tool_dir/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$tool_dir/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_dir/actionlint.tar.gz" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" -shellcheck="" -pyflakes="" .github/workflows/*.yml
      - name: Test release verification gates
        run: python scripts/test_release.py

  native:
    name: Native (${{ matrix.os }}, ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: minimal
            args: --no-default-features
          - os: ubuntu-latest
            features: all
            args: --all-features
          - os: windows-latest
            features: all
            args: --all-features
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - run: cargo test --locked --all-targets --no-fail-fast ${{ matrix.args }}
      - run: cargo test --locked --doc ${{ matrix.args }}
      - run: cargo clippy --locked --all-targets ${{ matrix.args }} -- -D warnings

  compatibility:
    name: Rust ${{ matrix.toolchain }} and WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, '1.95.0']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo check --locked --all-targets --no-default-features
      - run: cargo check --locked --lib --all-features
      - run: cargo clippy --locked --lib --all-features --target wasm32-unknown-unknown -- -D warnings
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --all-features --no-deps --target wasm32-unknown-unknown

  consumers:
    name: Browser consumer compilation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Check independent browser workspaces
        shell: bash
        run: |
          for example in browser-canvas browser-widget browser-host browser-raster; do
            cargo check --locked --manifest-path "examples/$example/Cargo.toml" --target wasm32-unknown-unknown
          done

  gallery:
    name: Chromium gallery rendering
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Locate workspace build output
        id: output
        shell: bash
        run: |
          cargo metadata --locked --no-deps --format-version 1 |
            python -c 'import json,sys; print("target_dir=" + json.load(sys.stdin)["target_directory"])' >> "$GITHUB_OUTPUT"
      - name: Generate and verify gallery in Chromium
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          gallery_dir="$TARGET_DIR/gallery-ci"
          cargo run --locked --all-features --example gallery -- "$gallery_dir"
          python -m http.server 8811 --bind 127.0.0.1 --directory "$gallery_dir" > "$TARGET_DIR/gallery-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --retry 20 --retry-delay 1 --retry-connrefused --fail --silent --show-error --output /dev/null http://127.0.0.1:8811/
          node scripts/browser-acceptance.mjs http://127.0.0.1:8811/ "$TARGET_DIR/gallery-browser.json" 2>&1 | tee "$TARGET_DIR/gallery-browser.log"
      - name: Verify chart extension exports
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          cargo run --locked --all-features --example waffle_custom -- "$TARGET_DIR/waffle-ci"
          node scripts/waffle-custom-acceptance.mjs "$TARGET_DIR/waffle-ci" "$TARGET_DIR/waffle-ci/browser-report.json" --chromium-only 2>&1 | tee "$TARGET_DIR/waffle-ci/browser.log"
          cargo run --locked --all-features --example calendar_year_legend -- "$TARGET_DIR/calendar-years-ci"
          node scripts/calendar-year-legend-acceptance.mjs "$TARGET_DIR/calendar-years-ci" "$TARGET_DIR/calendar-years-ci/browser-report.json" --chromium-only 2>&1 | tee "$TARGET_DIR/calendar-years-ci/browser.log"
          cargo run --locked --all-features --example bullet_custom -- "$TARGET_DIR/bullet-ci"
          node scripts/bullet-custom-acceptance.mjs "$TARGET_DIR/bullet-ci" "$TARGET_DIR/bullet-ci/browser-report.json" --chromium-only 2>&1 | tee "$TARGET_DIR/bullet-ci/browser.log"
          cargo run --locked --all-features --example bump_endpoint_labels -- "$TARGET_DIR/bump-endpoints-ci"
          node scripts/bump-endpoint-labels-acceptance.mjs "$TARGET_DIR/bump-endpoints-ci" "$TARGET_DIR/bump-endpoints-ci/browser-report.json" --chromium-only 2>&1 | tee "$TARGET_DIR/bump-endpoints-ci/browser.log"
          cargo run --locked --all-features --example geo_usa_primitives -- "$TARGET_DIR/geo-usa-primitives-ci"
          node scripts/geo-usa-primitives-acceptance.mjs "$TARGET_DIR/geo-usa-primitives-ci" "$TARGET_DIR/geo-usa-primitives-ci/browser-report.json" --chromium-only 2>&1 | tee "$TARGET_DIR/geo-usa-primitives-ci/browser.log"
          cargo run --locked --all-features --example geo_usa_maps -- "$TARGET_DIR/geo-usa-maps-ci"
          node scripts/geo-usa-maps-acceptance.mjs "$TARGET_DIR/geo-usa-maps-ci" "$TARGET_DIR/geo-usa-maps-ci/browser-report.json" --chromium-only 2>&1 | tee "$TARGET_DIR/geo-usa-maps-ci/browser.log"
          cargo run --locked --all-features --example geo_usa_streams -- "$TARGET_DIR/geo-usa-streams-ci"
          node scripts/geo-usa-streams-acceptance.mjs "$TARGET_DIR/geo-usa-streams-ci" "$TARGET_DIR/geo-usa-streams-ci/browser-report.json" --chromium-only 2>&1 | tee "$TARGET_DIR/geo-usa-streams-ci/browser.log"
      - name: Verify USA browser input and editable labels
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          cargo build --locked --manifest-path examples/browser-host/Cargo.toml --target wasm32-unknown-unknown --release
          host_target="$(cargo metadata --locked --manifest-path examples/browser-host/Cargo.toml --no-deps --format-version 1 | python -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          wasm-bindgen "$host_target/wasm32-unknown-unknown/release/kartis_host_fixture.wasm" --target web --out-dir examples/browser-host/pkg --out-name host
          mkdir -p "$TARGET_DIR/geo-usa-host-ci"
          node scripts/geo-usa-host-acceptance.mjs "$TARGET_DIR/geo-usa-host-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/geo-usa-host-ci/browser.log"
      - name: Verify repeated-domain WASM and SVG/Canvas consumers
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          mkdir -p "$TARGET_DIR/piecewise-repeated-host-ci"
          node scripts/piecewise-repeated-wasm-acceptance.mjs "$TARGET_DIR/piecewise-repeated-wasm-ci" 2>&1 | tee "$TARGET_DIR/piecewise-repeated-wasm-ci.log"
          node scripts/piecewise-repeated-host-acceptance.mjs "$TARGET_DIR/piecewise-repeated-host-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/piecewise-repeated-host-ci/browser.log"
      - name: Verify custom Swarm nodes and live network links
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          node scripts/node-link-custom-reference.mjs --check 2>&1 | tee "$TARGET_DIR/node-link-reference-ci.log"
          cargo run --locked --all-features --example swarm_custom -- "$TARGET_DIR/swarm-custom-export"
          node scripts/swarm-custom-acceptance.mjs "$TARGET_DIR/swarm-custom-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/swarm-custom-ci.log"
          node scripts/network-link-custom-acceptance.mjs "$TARGET_DIR/network-link-custom-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/network-link-custom-ci.log"
      - name: Verify typed Bullet Widget overlays
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          node scripts/bullet-widgets-acceptance.mjs "$TARGET_DIR/bullet-widgets-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/bullet-widgets-ci.log"
      - name: Verify transactional Widget ink composition
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          node scripts/widget-composition-acceptance.mjs "$TARGET_DIR/widget-composition-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/widget-composition-ci.log"
      - name: Verify Scene-order live Widget composition
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          node scripts/ordered-widgets-acceptance.mjs "$TARGET_DIR/ordered-widgets-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/ordered-widgets-ci.log"
      - name: Verify typed HeatMap and Waffle cell Widgets
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          node scripts/heatmap-widgets-acceptance.mjs "$TARGET_DIR/heatmap-widgets-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/heatmap-widgets-ci.log"
          node scripts/waffle-widgets-acceptance.mjs "$TARGET_DIR/waffle-widgets-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/waffle-widgets-ci.log"
      - name: Verify original Stream dot contract and live components
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          node scripts/stream-dot-widget-reference.mjs --frozen
          node scripts/stream-widgets-acceptance.mjs "$TARGET_DIR/stream-widgets-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/stream-widgets-ci.log"
      - name: Verify Waffle group regions and physical ink separation
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          node scripts/waffle-regions-acceptance.mjs "$TARGET_DIR/waffle-regions-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/waffle-regions-ci.log"
      - name: Verify original Scatter node contract and live components
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          node scripts/scatter-node-widget-reference.mjs --frozen
          node scripts/scatter-widgets-acceptance.mjs "$TARGET_DIR/scatter-widgets-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/scatter-widgets-ci.log"
      - name: Verify original Bar component contract and live components
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          node scripts/bar-widget-reference.mjs --frozen
          node scripts/bar-widgets-acceptance.mjs "$TARGET_DIR/bar-widgets-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/bar-widgets-ci.log"
      - name: Verify original Bump point contract and live components
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          node scripts/bump-point-widget-reference.mjs --frozen
          node scripts/bump-widgets-acceptance.mjs "$TARGET_DIR/bump-widgets-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/bump-widgets-ci.log"
      - name: Verify original hierarchy component contracts and live nodes
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          node scripts/hierarchy-node-widget-reference.mjs --frozen
          node scripts/hierarchy-widgets-acceptance.mjs "$TARGET_DIR/hierarchy-widgets-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/hierarchy-widgets-ci.log"
      - name: Verify original Network node contract and live force components
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          node scripts/network-node-widget-reference.mjs --frozen
          node scripts/network-widgets-acceptance.mjs "$TARGET_DIR/network-widgets-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/network-widgets-ci.log"
      - name: Verify original Network link contract and mixed live components
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          node scripts/network-link-widget-reference.mjs --frozen
          node scripts/network-link-widgets-acceptance.mjs "$TARGET_DIR/network-link-widgets-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/network-link-widgets-ci.log"
      - name: Verify original Stream function configuration
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          node scripts/stream-function-reference.mjs --frozen
          node scripts/stream-functions-acceptance.mjs "$TARGET_DIR/stream-functions-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/stream-functions-ci.log"
      - name: Verify original Tree function configuration
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          node scripts/tree-function-reference.mjs --frozen
          node scripts/tree-functions-acceptance.mjs "$TARGET_DIR/tree-functions-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/tree-functions-ci.log"
      - name: Verify original Tree activity and live ownership
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          node scripts/tree-activity-reference.mjs --frozen
          node scripts/tree-activity-acceptance.mjs "$TARGET_DIR/tree-activity-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/tree-activity-ci.log"
      - name: Verify original Tree node and link components
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          node scripts/tree-widget-reference.mjs --frozen
          node scripts/tree-widgets-acceptance.mjs "$TARGET_DIR/tree-widgets-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/tree-widgets-ci.log"
      - name: Verify original Funnel layers and live stage roles
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          node scripts/funnel-layer-widget-reference.mjs --frozen
          node scripts/funnel-widgets-acceptance.mjs "$TARGET_DIR/funnel-widgets-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/funnel-widgets-ci.log"
      - name: Verify original Swarm node contract and live components
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          node scripts/swarm-node-widget-reference.mjs --frozen
          node scripts/swarm-widgets-acceptance.mjs "$TARGET_DIR/swarm-widgets-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/swarm-widgets-ci.log"
      - name: Verify typed Widget raw-value-only updates
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          node scripts/widget-source-values-acceptance.mjs "$TARGET_DIR/widget-raw-bits-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/widget-raw-bits-ci.log"
      - name: Verify exact viewport screenshot sampling
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          node scripts/viewport-capture-acceptance.mjs "$TARGET_DIR/viewport-capture-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/viewport-capture-ci.log"
      - name: Verify typed CPU image Chart input and Widget rollback
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: |
          cargo build --locked --manifest-path examples/browser-widget/Cargo.toml --target wasm32-unknown-unknown --release
          widget_target="$(cargo metadata --locked --manifest-path examples/browser-widget/Cargo.toml --no-deps --format-version 1 | python -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          wasm-bindgen "$widget_target/wasm32-unknown-unknown/release/kartis_widget_fixture.wasm" --target web --out-dir examples/browser-widget/pkg --out-name widget
          node scripts/raster-chart-bindings-acceptance.mjs "$TARGET_DIR/raster-chart-bindings-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/raster-chart-bindings-ci.log"
      - name: Preserve browser verification reports
        if: ${{ !cancelled() && steps.output.outputs.target_dir != '' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: gallery-browser-reports
          path: |
            ${{ steps.output.outputs.target_dir }}/gallery-browser.json
            ${{ steps.output.outputs.target_dir }}/gallery-browser.log
            ${{ steps.output.outputs.target_dir }}/gallery-http.log
            ${{ steps.output.outputs.target_dir }}/waffle-ci/**
            ${{ steps.output.outputs.target_dir }}/calendar-years-ci/**
            ${{ steps.output.outputs.target_dir }}/bullet-ci/**
            ${{ steps.output.outputs.target_dir }}/bump-endpoints-ci/**
            ${{ steps.output.outputs.target_dir }}/geo-usa-primitives-ci/**
            ${{ steps.output.outputs.target_dir }}/geo-usa-maps-ci/**
            ${{ steps.output.outputs.target_dir }}/geo-usa-streams-ci/**
            ${{ steps.output.outputs.target_dir }}/geo-usa-host-ci/**
            ${{ steps.output.outputs.target_dir }}/piecewise-repeated-host-ci/**
            ${{ steps.output.outputs.target_dir }}/piecewise-repeated-wasm-ci/**
            ${{ steps.output.outputs.target_dir }}/piecewise-repeated-wasm-ci.log
            ${{ steps.output.outputs.target_dir }}/node-link-reference-ci.log
            ${{ steps.output.outputs.target_dir }}/swarm-custom-export/**
            ${{ steps.output.outputs.target_dir }}/swarm-custom-ci/**
            ${{ steps.output.outputs.target_dir }}/swarm-custom-ci.log
            ${{ steps.output.outputs.target_dir }}/network-link-custom-ci/**
            ${{ steps.output.outputs.target_dir }}/network-link-custom-ci.log
            ${{ steps.output.outputs.target_dir }}/bullet-widgets-ci/**
            ${{ steps.output.outputs.target_dir }}/bullet-widgets-ci.log
            ${{ steps.output.outputs.target_dir }}/widget-composition-ci/**
            ${{ steps.output.outputs.target_dir }}/widget-composition-ci.log
            ${{ steps.output.outputs.target_dir }}/ordered-widgets-ci/**
            ${{ steps.output.outputs.target_dir }}/ordered-widgets-ci.log
            ${{ steps.output.outputs.target_dir }}/heatmap-widgets-ci/**
            ${{ steps.output.outputs.target_dir }}/heatmap-widgets-ci.log
            ${{ steps.output.outputs.target_dir }}/waffle-widgets-ci/**
            ${{ steps.output.outputs.target_dir }}/waffle-widgets-ci.log
            ${{ steps.output.outputs.target_dir }}/raster-chart-bindings-ci/**
            ${{ steps.output.outputs.target_dir }}/raster-chart-bindings-ci.log
            ${{ steps.output.outputs.target_dir }}/stream-widgets-ci/**
            ${{ steps.output.outputs.target_dir }}/stream-widgets-ci.log
            ${{ steps.output.outputs.target_dir }}/waffle-regions-ci/**
            ${{ steps.output.outputs.target_dir }}/waffle-regions-ci.log
            ${{ steps.output.outputs.target_dir }}/scatter-widgets-ci/**
            ${{ steps.output.outputs.target_dir }}/scatter-widgets-ci.log
            ${{ steps.output.outputs.target_dir }}/bar-widgets-ci/**
            ${{ steps.output.outputs.target_dir }}/bar-widgets-ci.log
            ${{ steps.output.outputs.target_dir }}/bump-widgets-ci/**
            ${{ steps.output.outputs.target_dir }}/bump-widgets-ci.log
            ${{ steps.output.outputs.target_dir }}/hierarchy-widgets-ci/**
            ${{ steps.output.outputs.target_dir }}/hierarchy-widgets-ci.log
            ${{ steps.output.outputs.target_dir }}/network-widgets-ci/**
            ${{ steps.output.outputs.target_dir }}/network-widgets-ci.log
            ${{ steps.output.outputs.target_dir }}/network-link-widgets-ci/**
            ${{ steps.output.outputs.target_dir }}/network-link-widgets-ci.log
            ${{ steps.output.outputs.target_dir }}/stream-functions-ci/**
            ${{ steps.output.outputs.target_dir }}/stream-functions-ci.log
            ${{ steps.output.outputs.target_dir }}/tree-functions-ci/**
            ${{ steps.output.outputs.target_dir }}/tree-functions-ci.log
            ${{ steps.output.outputs.target_dir }}/tree-activity-ci/**
            ${{ steps.output.outputs.target_dir }}/tree-activity-ci.log
            ${{ steps.output.outputs.target_dir }}/tree-widgets-ci/**
            ${{ steps.output.outputs.target_dir }}/tree-widgets-ci.log
            ${{ steps.output.outputs.target_dir }}/funnel-widgets-ci/**
            ${{ steps.output.outputs.target_dir }}/funnel-widgets-ci.log
            ${{ steps.output.outputs.target_dir }}/swarm-widgets-ci/**
