  package:
    name: crates.io package verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: cargo package --locked --all-features
      - name: Test the unpacked release crate
        shell: bash
        run: |
          crate_dir="$(cargo metadata --locked --no-deps --format-version 1 | python -c 'import json,pathlib,sys; d=json.load(sys.stdin); p=next(p for p in d["packages"] if p["id"] == d["workspace_default_members"][0]); print(pathlib.Path(d["target_directory"]) / "package" / (p["name"] + "-" + p["version"]))')"
          cargo metadata --locked --no-deps --format-version 1 --manifest-path "$crate_dir/Cargo.toml" |
            python -c 'import json,sys; print("Unpacked crate target_directory: " + json.load(sys.stdin)["target_directory"])'
          cargo test --locked --all-features --all-targets --manifest-path "$crate_dir/Cargo.toml"

  tree-spring-waffle-functions:
    name: Chromium Tree spring, Waffle functions and Funnel layers
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95.0'
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Locate workspace evidence directory
        id: output
        shell: bash
        run: |
          target_dir="$(cargo +1.95.0 metadata --locked --no-deps --format-version 1 | python -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          mkdir -p "$target_dir"
          echo "target_dir=$target_dir" >> "$GITHUB_OUTPUT"
      - run: cargo +1.95.0 install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build a source-bound browser package
        id: producer
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: python scripts/build-browser-acceptance.py --out="$TARGET_DIR/browser-extensions-ci/producer" 2>&1 | tee "$TARGET_DIR/browser-extensions-producer.log"
      - name: Verify Tree spring at both DPRs
        if: ${{ !cancelled() && steps.producer.outcome == 'success' }}
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: node scripts/tree-motion-acceptance.mjs --engine=chromium --pkg="$TARGET_DIR/browser-extensions-ci/producer/pkg" --out="$TARGET_DIR/browser-extensions-ci/tree-motion" 2>&1 | tee "$TARGET_DIR/browser-extensions-tree-motion.log"
      - name: Verify ordinary Tree annotations at both DPRs
        if: ${{ !cancelled() && steps.producer.outcome == 'success' }}
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: node scripts/tree-motion-extras-acceptance.mjs --chromium-only --pkg="$TARGET_DIR/browser-extensions-ci/producer/pkg" --out="$TARGET_DIR/browser-extensions-ci/tree-extras" 2>&1 | tee "$TARGET_DIR/browser-extensions-tree-extras.log"
      - name: Verify Waffle functions and live Widgets at both DPRs
        if: ${{ !cancelled() && steps.producer.outcome == 'success' }}
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: node scripts/waffle-functions-acceptance.mjs --chromium-only --pkg="$TARGET_DIR/browser-extensions-ci/producer/pkg" --out="$TARGET_DIR/browser-extensions-ci/waffle-functions" 2>&1 | tee "$TARGET_DIR/browser-extensions-waffle-functions.log"
      - name: Verify literal Waffle SVG layers at both DPRs
        if: ${{ !cancelled() && steps.producer.outcome == 'success' }}
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: node scripts/waffle-svg-layers-acceptance.mjs --browser=Chromium --pkg="$TARGET_DIR/browser-extensions-ci/producer/pkg" --out="$TARGET_DIR/browser-extensions-ci/waffle-svg-layers" 2>&1 | tee "$TARGET_DIR/browser-extensions-waffle-svg-layers.log"
      - name: Verify literal Funnel SVG layers at both DPRs
        if: ${{ !cancelled() && steps.producer.outcome == 'success' }}
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: node scripts/funnel-svg-layers-acceptance.mjs --browser=Chromium --pkg="$TARGET_DIR/browser-extensions-ci/producer/pkg" --out="$TARGET_DIR/browser-extensions-ci/funnel-svg-layers" 2>&1 | tee "$TARGET_DIR/browser-extensions-funnel-svg-layers.log"
      - name: Verify native Funnel hooks and tooltips at both DPRs
        if: ${{ !cancelled() && steps.producer.outcome == 'success' }}
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: node scripts/funnel-interactions-acceptance.mjs --browser=Chromium --pkg="$TARGET_DIR/browser-extensions-ci/producer/pkg" --out="$TARGET_DIR/browser-extensions-ci/funnel-interactions" 2>&1 | tee "$TARGET_DIR/browser-extensions-funnel-interactions.log"
      - name: Verify bound Funnel annotations at both DPRs
        if: ${{ !cancelled() && steps.producer.outcome == 'success' }}
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: node scripts/funnel-annotations-acceptance.mjs --browser=Chromium --pkg="$TARGET_DIR/browser-extensions-ci/producer/pkg" --out="$TARGET_DIR/browser-extensions-ci/funnel-annotations" 2>&1 | tee "$TARGET_DIR/browser-extensions-funnel-annotations.log"
      - name: Verify opaque Funnel application data at both DPRs
        if: ${{ !cancelled() && steps.producer.outcome == 'success' }}
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: node scripts/funnel-data-acceptance.mjs --browser=Chromium --pkg="$TARGET_DIR/browser-extensions-ci/producer/pkg" --out="$TARGET_DIR/browser-extensions-ci/funnel-data" 2>&1 | tee "$TARGET_DIR/browser-extensions-funnel-data.log"
      - name: Verify Funnel property springs at both DPRs
        if: ${{ !cancelled() && steps.producer.outcome == 'success' }}
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: node scripts/funnel-motion-acceptance.mjs --browser=Chromium --pkg="$TARGET_DIR/browser-extensions-ci/producer/pkg" --out="$TARGET_DIR/browser-extensions-ci/funnel-motion" 2>&1 | tee "$TARGET_DIR/browser-extensions-funnel-motion.log"
      - name: Verify dormant Funnel springs at both DPRs
        if: ${{ !cancelled() && steps.producer.outcome == 'success' }}
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: node scripts/funnel-dormant-acceptance.mjs --browser=Chromium --pkg="$TARGET_DIR/browser-extensions-ci/producer/pkg" --out="$TARGET_DIR/browser-extensions-ci/funnel-dormant" 2>&1 | tee "$TARGET_DIR/browser-extensions-funnel-dormant.log"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: tree-spring-waffle-functions
          path: |
            ${{ steps.output.outputs.target_dir }}/browser-extensions-ci/**
            ${{ steps.output.outputs.target_dir }}/browser-extensions-*.log
          if-no-files-found: warn
          retention-days: 14
