  site:
    name: Showcase build and browser smoke
    uses: ./.github/workflows/site.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  pointer-input:
    name: Chromium Tree pointer and retained components
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Locate workspace build output
        id: output
        shell: bash
        run: |
          cargo metadata --locked --no-deps --format-version 1 |
            python -c 'import json,sys; print("target_dir=" + json.load(sys.stdin)["target_directory"])' >> "$GITHUB_OUTPUT"
      - name: Build browser fixture from this commit
        shell: bash
        run: |
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          cargo build --locked --manifest-path examples/browser-host/Cargo.toml --target wasm32-unknown-unknown --release
          host_target="$(cargo metadata --locked --manifest-path examples/browser-host/Cargo.toml --no-deps --format-version 1 | python -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')"
          wasm-bindgen "$host_target/wasm32-unknown-unknown/release/kartis_host_fixture.wasm" --target web --out-dir examples/browser-host/pkg --out-name host
      - name: Verify native pointer lifecycle
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: node scripts/tree-input-lifecycle-acceptance.mjs "$TARGET_DIR/tree-input-lifecycle-ci" --chromium-only 2>&1 | tee "$TARGET_DIR/tree-input-lifecycle-ci.log"
      - name: Verify retained UI error recovery after commit
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: node scripts/tree-ui-errors-acceptance.mjs --chromium-only --out="$TARGET_DIR/tree-ui-errors-ci" 2>&1 | tee "$TARGET_DIR/tree-ui-errors-ci.log"
      - name: Verify real Tree label components
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: node scripts/tree-label-components-acceptance.mjs --chromium-only --out="$TARGET_DIR/tree-label-components-ci" 2>&1 | tee "$TARGET_DIR/tree-label-components-ci.log"
      - name: Verify fixed-Scene nonuniform label placement
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: node scripts/scene-label-affine-acceptance.mjs --chromium-only --out="$TARGET_DIR/scene-label-affine-ci" 2>&1 | tee "$TARGET_DIR/scene-label-affine-ci.log"
      - name: Verify native Tree Canvas callbacks and shared state
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: node scripts/tree-canvas-native-acceptance.mjs --chromium-only --out="$TARGET_DIR/tree-canvas-native-ci" 2>&1 | tee "$TARGET_DIR/tree-canvas-native-ci.log"
      - name: Verify sealed Tree Canvas owner transactions
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: node scripts/tree-canvas-owner-acceptance.mjs --chromium-only --out="$TARGET_DIR/tree-canvas-owner-ci" 2>&1 | tee "$TARGET_DIR/tree-canvas-owner-ci.log"
      - name: Verify native Canvas and retained Tree components together
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: node scripts/tree-canvas-widgets-acceptance.mjs --chromium-only --out="$TARGET_DIR/tree-canvas-widgets-ci" 2>&1 | tee "$TARGET_DIR/tree-canvas-widgets-ci.log"
      - name: Verify rollback after candidate Canvas paint and DOM refusal
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: node scripts/tree-canvas-widgets-late-dom-acceptance.mjs --chromium-only --dpr=1 --out="$TARGET_DIR/tree-canvas-widgets-late-dom-ci" 2>&1 | tee "$TARGET_DIR/tree-canvas-widgets-late-dom-ci.log"
      - name: Verify origin-tainted candidate rejection
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: node scripts/tree-canvas-taint-acceptance.mjs --chromium-only --out="$TARGET_DIR/tree-canvas-taint-ci" 2>&1 | tee "$TARGET_DIR/tree-canvas-taint-ci.log"
      - name: Verify native Tree tooltips and retained presentation components
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: node scripts/tree-tooltip-acceptance.mjs --chromium-only --out="$TARGET_DIR/tree-tooltip-ci" 2>&1 | tee "$TARGET_DIR/tree-tooltip-ci.log"
      - name: Verify literal Tree SVG layers and retained Glory subtrees
        env:
          TARGET_DIR: ${{ steps.output.outputs.target_dir }}
        shell: bash
        run: node scripts/tree-svg-layers-acceptance.mjs --chromium-only --out="$TARGET_DIR/tree-svg-layers-ci" 2>&1 | tee "$TARGET_DIR/tree-svg-layers-ci.log"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: tree-pointer-lifecycle
          path: |
            ${{ steps.output.outputs.target_dir }}/tree-input-lifecycle-ci/**
            ${{ steps.output.outputs.target_dir }}/tree-input-lifecycle-ci.log
            ${{ steps.output.outputs.target_dir }}/tree-ui-errors-ci/**
            ${{ steps.output.outputs.target_dir }}/tree-ui-errors-ci.log
            ${{ steps.output.outputs.target_dir }}/tree-label-components-ci/**
            ${{ steps.output.outputs.target_dir }}/tree-label-components-ci.log
            ${{ steps.output.outputs.target_dir }}/scene-label-affine-ci/**
            ${{ steps.output.outputs.target_dir }}/scene-label-affine-ci.log
            ${{ steps.output.outputs.target_dir }}/tree-canvas-native-ci/**
            ${{ steps.output.outputs.target_dir }}/tree-canvas-native-ci.log
            ${{ steps.output.outputs.target_dir }}/tree-canvas-owner-ci/**
            ${{ steps.output.outputs.target_dir }}/tree-canvas-owner-ci.log
            ${{ steps.output.outputs.target_dir }}/tree-canvas-widgets-ci/**
            ${{ steps.output.outputs.target_dir }}/tree-canvas-widgets-ci.log
            ${{ steps.output.outputs.target_dir }}/tree-canvas-widgets-late-dom-ci/**
            ${{ steps.output.outputs.target_dir }}/tree-canvas-widgets-late-dom-ci.log
            ${{ steps.output.outputs.target_dir }}/tree-canvas-taint-ci/**
            ${{ steps.output.outputs.target_dir }}/tree-canvas-taint-ci.log
            ${{ steps.output.outputs.target_dir }}/tree-tooltip-ci/**
            ${{ steps.output.outputs.target_dir }}/tree-tooltip-ci.log
            ${{ steps.output.outputs.target_dir }}/tree-svg-layers-ci/**
            ${{ steps.output.outputs.target_dir }}/tree-svg-layers-ci.log
          if-no-files-found: warn
          retention-days: 14

