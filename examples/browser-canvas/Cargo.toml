[package]
name = "kartis-canvas-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]
resolver = "3"

[dependencies]
kartis = { path = "../..", features = ["canvas"] }
wasm-bindgen = "=0.2.130"
web-sys = { version = "=0.3.107", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlButtonElement", "Event", "EventTarget", "PointerEvent", "MouseEvent", "KeyboardEvent", "DomRect", "CssStyleDeclaration", "console"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
